<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Capri OCR Sabit</title>
  <link rel="stylesheet" href="ocr.css">
</head>
<body class="pin">
  <div class="card" id="card">
    <div class="head pywebview-drag-region">
      <span class="mark"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h10M9 4v3M6 7c1 4 4 7 8 8M12 7c-1 4-4 7-7 8M14 20l4-9 4 9M15.5 17h5"/></svg></span>
      <span class="pill ok live" id="state">Canlı</span>
      <span class="grow"></span>
      <span class="meta" id="meta" style="flex:0 1 auto;margin-right:4px"></span>
      <button class="icon-btn" id="toggle" title="Duraklat / sürdür"><svg class="i" viewBox="0 0 24 24" id="toggleIcon"><path d="M8 5v14M16 5v14"/></svg></button>
      <button class="icon-btn close" id="close" title="Sabitlemeyi kaldır"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="body"><div class="tr selectable" id="tr">Alan izleniyor…</div></div>
  </div>
  <script src="i18n.js"></script>
  <script>
    "use strict";
    const $ = (s) => document.querySelector(s);
    const api = () => window.pywebview && window.pywebview.api;
    const PAUSE = '<path d="M8 5v14M16 5v14"/>', PLAY = '<path d="M7 5v14l11-7z"/>';

    function fit() {
      requestAnimationFrame(() => api() && api().ocr_resize("pin", Math.ceil($("#card").scrollHeight)));
    }

    window.OCRPIN = {
      update(d) {
        if (d.place) document.body.classList.toggle("over", d.place === "over");
        if (d.translation !== undefined) $("#tr").textContent = d.translation || "…";
        if (d.meta !== undefined) $("#meta").textContent = d.meta;
        if (d.state) {
          const map = { live: ["Canlı", "pill ok live"], paused: ["Duraklatıldı", "pill warn"], busy: ["Çevriliyor", "pill ok live"], error: ["Hata", "pill warn"] };
          const [text, cls] = map[d.state] || map.live;
          $("#state").textContent = text;
          $("#state").className = cls;
          $("#toggleIcon").innerHTML = d.state === "paused" ? PLAY : PAUSE;
        }
        fit();
      },
    };
    $("#toggle").addEventListener("click", () => api().ocr_pin_toggle());
    $("#close").addEventListener("click", () => api().ocr_pin_stop());
    // Arayüz dili: ana pencereyle aynı sözlük (dil değişince Python tarafı yeniden gönderir)
    const loadUiLanguage = () => api() && api().ui_dictionary && api().ui_dictionary()
      .then((r) => r && window.I18N && I18N.set(r.language, r.dict)).catch(() => {});
    if (api()) loadUiLanguage(); else addEventListener("pywebviewready", loadUiLanguage);
  </script>
</body>
</html>
